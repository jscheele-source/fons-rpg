name: Build and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot CI environment
        shell: bash
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version
          find ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable -maxdepth 1 -type f -print

      - name: Validate Godot project
        shell: bash
        run: godot --headless --verbose --path . --editor --quit

      - name: Smoke-test courtyard scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . res://scenes/Main.tscn --quit-after 2 2>&1 | tee main-scene.log
          if grep -q "SCRIPT ERROR" main-scene.log; then
            echo "Runtime script error detected while opening Main.tscn"
            exit 1
          fi

      - name: Smoke-test dialogue branches
        shell: bash
        run: godot --headless --path . -s res://tests/dialogue_smoke.gd

      - name: Export browser build
        shell: bash
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --path . --export-release "Web" "$EXPORT_DIR/web/index.html"
          touch build/web/.nojekyll

      - name: Publish browser build
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
          single-commit: true
