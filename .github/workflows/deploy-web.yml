name: Build and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot CI environment
        shell: bash
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version
          find ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable -maxdepth 1 -type f -print

      - name: Validate Godot project
        shell: bash
        run: godot --headless --verbose --path . --editor --quit

      - name: Smoke-test courtyard scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . res://scenes/Main.tscn --quit-after 2 2>&1 | tee main-scene.log
          if grep -q "SCRIPT ERROR" main-scene.log; then
            echo "Runtime script error detected while opening Main.tscn"
            exit 1
          fi

      - name: Smoke-test dialogue branches
        shell: bash
        run: godot --headless --path . res://tests/DialogueSmoke.tscn

      - name: Smoke-test character creation flow
        shell: bash
        run: godot --headless --path . res://tests/MenuFlowSmoke.tscn

      - name: Smoke-test monastery routes
        shell: bash
        run: godot --headless --path . res://tests/MonasteryRouteSmoke.tscn

      - name: Smoke-test milestone 1 polish
        shell: bash
        run: godot --headless --path . res://tests/Milestone1Smoke.tscn

      - name: Smoke-test milestone 2 interactions
        shell: bash
        run: godot --headless --path . res://tests/Milestone2Smoke.tscn

      - name: Smoke-test save-position recovery
        shell: bash
        run: godot --headless --path . res://tests/SavePositionRecoverySmoke.tscn

      - name: Smoke-test NPC conduct and disposition
        shell: bash
        run: godot --headless --path . res://tests/ConductSmoke.tscn

      - name: Smoke-test escalated discipline and remediation
        shell: bash
        run: godot --headless --path . res://tests/ConductEscalationSmoke.tscn

      - name: Export browser build with cache-busted package names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --path . --export-release "Web" "$EXPORT_DIR/web/index.html"

          BUILD_TAG="${GITHUB_SHA:0:12}"
          mv build/web/index.js "build/web/fons-${BUILD_TAG}.js"
          mv build/web/index.pck "build/web/fons-${BUILD_TAG}.pck"
          mv build/web/index.wasm "build/web/fons-${BUILD_TAG}.wasm"

          sed -i "s/src=\"index.js\"/src=\"fons-${BUILD_TAG}.js\"/" build/web/index.html
          sed -i "s/\"executable\":\"index\"/\"executable\":\"fons-${BUILD_TAG}\"/" build/web/index.html
          sed -i "s/\"index.pck\":/\"fons-${BUILD_TAG}.pck\":/" build/web/index.html
          sed -i "s/\"index.wasm\":/\"fons-${BUILD_TAG}.wasm\":/" build/web/index.html

          cp "build/web/fons-${BUILD_TAG}.js" build/web/index.js
          cp "build/web/fons-${BUILD_TAG}.pck" build/web/index.pck
          cp "build/web/fons-${BUILD_TAG}.wasm" build/web/index.wasm

          echo "${GITHUB_SHA}" > build/web/build-id.txt
          touch build/web/.nojekyll

      - name: Verify browser package consistency
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAG="${GITHUB_SHA:0:12}"
          test -s "build/web/fons-${BUILD_TAG}.js"
          test -s "build/web/fons-${BUILD_TAG}.pck"
          test -s "build/web/fons-${BUILD_TAG}.wasm"
          grep -q "fons-${BUILD_TAG}.js" build/web/index.html
          grep -q "fons-${BUILD_TAG}.pck" build/web/index.html
          grep -q "fons-${BUILD_TAG}.wasm" build/web/index.html
          grep -q "${GITHUB_SHA}" build/web/build-id.txt

      - name: Publish browser build
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
          single-commit: true
