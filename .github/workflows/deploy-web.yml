name: Build and Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Godot project
        shell: bash
        run: |
          HOME=/root godot --version
          HOME=/root godot --headless --path . --editor --quit

      - name: Export browser build
        shell: bash
        run: |
          mkdir -p build/web
          HOME=/root godot --headless --verbose --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Publish browser build
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
          single-commit: true
